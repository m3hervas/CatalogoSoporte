<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de página WordPress — prueba del catálogo</title>
  <!-- Typical WordPress theme styles, deliberately aggressive, to check the catalogue stays isolated -->
  <style>
    body { margin: 0; font: 17px/1.7 Georgia, serif; color: #333; background: #fafafa; }
    a { color: #c0392b; text-decoration: underline; }
    h1, h2, h3 { font-family: "Times New Roman", serif; color: #111; margin: 1em 0 .5em; }
    button, select, input, textarea { font: 16px Georgia, serif; border-radius: 0; background: #eee; color: #111; }
    img { border: 3px solid #ccc; }
    p { margin: 0 0 1.4em; }
    .wp-header { background: #222; color: #fff; padding: 18px 24px; }
    .wp-header a { color: #fff; margin-right: 18px; }
    .wp-content { max-width: 760px; margin: 0 auto; padding: 30px 20px; background: #fff; }
    .wp-footer { background: #222; color: #aaa; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header class="wp-header"><strong>Mi WordPress</strong> &nbsp; <a href="#">Inicio</a><a href="#">Servicios</a><a href="#">Contacto</a></header>
  <main class="wp-content">
    <h1>Página de prueba</h1>
    <p>Texto de una página normal de WordPress antes del catálogo.</p>
<!--CATALOGO-->
    <p>Texto después del catálogo.</p>
  </main>
  <footer class="wp-footer">Pie de página del tema de WordPress</footer>
</body>
</html>
