<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador WordPress</title>
<style>
  /* Estilos típicos de un tema de WordPress, para comprobar que no rompen el catálogo */
  body { margin: 0; font-family: Georgia, serif; font-size: 18px; line-height: 1.8; color: #333; background: #fafafa; }
  .site-header { background: #222; color: #fff; padding: 18px 24px; display: flex; justify-content: space-between; }
  .site-header a { color: #fff; margin-left: 18px; text-decoration: none; }
  .entry-content { max-width: 720px; margin: 40px auto; padding: 0 20px; }
  h1, h2, h3 { font-family: Georgia, serif; text-transform: uppercase; letter-spacing: 2px; color: #111; margin: 1.5em 0 .6em; }
  p { margin: 0 0 1.4em; color: #444; }
  button, input, select, textarea { font-family: Georgia, serif; text-transform: uppercase; padding: 14px; border: 2px solid #999; border-radius: 0; background: #eee; min-height: 48px; }
  img { max-width: 100%; height: auto; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  footer { background: #222; color: #aaa; padding: 30px; }
  header { border-bottom: 4px solid red; }
</style>
</head>
<body>
<header class="site-header"><strong>Mi WordPress</strong><nav><a href="#">Inicio</a><a href="#">Catálogo</a><a href="#">Contacto</a></nav></header>
<main class="entry-content">
<h1>Catálogo</h1>
<p>Texto de la página antes del bloque.</p>
<!--CATALOGO-->
<p>Texto de la página después del bloque.</p>
</main>
<footer class="site-footer">Pie de página del tema</footer>
</body>
</html>
